
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كون خيرنا</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div>
      <strong>كون خيرنا 🌍</strong>
      <span>الإصدار التأسيسي V0.1</span>
    </div>
    <div id="world-status">العالم يعمل</div>
  </header>

  <main>
    <section class="world-panel">
      <h1>المدينة الأولى</h1>
      <p>مجتمعنا الرقمي الصغير</p>
      <div id="game-container"></div>
      <div class="legend">
        🔵 المدير　 🟠 البنّاء　 🟢 الباحث
      </div>
    </section>

    <aside class="side-panel">
      <section class="card">
        <h2>الوكلاء</h2>
        <div id="agents-list"></div>
      </section>

      <section class="card">
        <h2>موارد العالم</h2>
        <div class="resource">نقاط المجتمع <strong id="points">30</strong></div>
        <div class="resource">مواد البناء <strong id="materials">12</strong></div>
        <div class="resource">المعرفة <strong id="knowledge">8</strong></div>
      </section>

      <section class="card">
        <h2>سجل الأحداث</h2>
        <ol id="event-log">
          <li>تم إنشاء العالم لأول مرة.</li>
        </ol>
      </section>

      <section class="controls">
        <button id="pause-btn">إيقاف المحاكاة</button>
        <button id="save-btn">حفظ العالم</button>
        <button id="reset-btn">إعادة ضبط التجربة</button>
        <p id="save-status">الحفظ محلي على جهازك.</p>
      </section>
    </aside>
  </main>

  <footer>كون خيرنا — عالم رقمي تجريبي</footer>

  <script src="agents/agents.js"></script>
  <script src="systems/world-state.js"></script>
  <script src="game.js"></script>

</body>
</html>
